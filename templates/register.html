{% extends "base.html" %}

{% block title %}
Register | GaonKhiladi
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-card">

        <h1>
            Join GaonKhiladi
        </h1>

        <p>
            Create your sports identity.
        </p>

        <form method="POST">

            <label>
                Full Name
            </label>

            <input type="text" name="full_name" required>


            <label>
                Username
            </label>

            <input type="text" name="username" required>


            <label>
                Password
            </label>

            <input type="password" name="password" required>


            <label>
                Account Type
            </label>

            <select name="role" id="role">

                <option value="athlete">
                    Athlete
                </option>

                <option value="coach">
                    Coach
                </option>

                <option value="scout">
                    Scout
                </option>

            </select>


            <label>
                Sport
            </label>

            <select name="sport">

                <option value="Athletics">
                    Athletics
                </option>

                <option value="Football">
                    Football
                </option>

                <option value="Cricket">
                    Cricket
                </option>

                <option value="Boxing">
                    Boxing
                </option>

                <option value="Wrestling">
                    Wrestling
                </option>

                <option value="Badminton">
                    Badminton
                </option>

                <option value="Archery">
                    Archery
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <div id="athlete-coach-fields">
                <label>
                    Age
                </label>

                <input type="number" name="age" min="8" max="60">


                <label>
                    City / Village
                </label>

                <input type="text" name="city" placeholder="Your village or town">


                <label>
                    State
                </label>

                <input type="text" name="state" placeholder="Assam">
            </div>


            <label>
                Preferred Language
            </label>

            <select name="language">

                <option>
                    English
                </option>

                <option>
                    Hindi
                </option>

                <option>
                    Assamese
                </option>

                <option>
                    Bengali
                </option>

            </select>


            <button type="submit" class="primary-btn full-btn">

                Create Account

            </button>

        </form>

        <p>
            Already registered?
            <a href="/login">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
