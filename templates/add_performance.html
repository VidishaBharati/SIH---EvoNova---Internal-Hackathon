{% extends "base.html" %}

{% block title %}
Add Performance | GaonKhiladi
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-card">

        <h1>
            📊 Add Performance
        </h1>

        <p>
            Submit your latest verified-style
            performance data.
        </p>

        <form method="POST">

            <label>
                Sport
            </label>

            <input
                type="text"
                name="sport"
                required
            >


            <label>
                Event
            </label>

            <input
                type="text"
                name="event"
                placeholder="100m Sprint"
            >


            <label>
                Metric
            </label>

            <input
                type="text"
                name="metric"
                placeholder="Timing / Distance / Score"
                required
            >


            <label>
                Value
            </label>

            <input
                type="number"
                step="0.01"
                name="value"
                required
            >


            <label>
                Unit
            </label>

            <input
                type="text"
                name="unit"
                placeholder="seconds / meters / points"
            >


            <label>
                Benchmark
            </label>

            <input
                type="number"
                step="0.01"
                name="benchmark"
                placeholder="Optional"
            >


            <button
                class="primary-btn full-btn"
                type="submit">

                Submit Performance

            </button>

        </form>

    </div>

</div>

{% endblock %}
